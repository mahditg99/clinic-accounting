{% extends "base.html" %}
{% block title %}تغییر رمز عبور — {{ app_title }}{% endblock %}
{% block page_title %}تغییر رمز عبور{% endblock %}
{% block content %}
<div class="card" style="max-width:440px;">
  <h3 class="card-title">تغییر رمز عبور مدیر</h3>
  {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
  <form method="post" action="/change-password">
    <div class="form-row">
      <label class="flabel" for="current_password">رمز عبور فعلی</label>
      <input type="password" id="current_password" name="current_password" required autocomplete="current-password">
    </div>
    <div class="form-row">
      <label class="flabel" for="new_password">رمز جدید</label>
      <input type="password" id="new_password" name="new_password" required minlength="4" autocomplete="new-password">
    </div>
    <div class="form-row">
      <label class="flabel" for="confirm_password">تکرار رمز جدید</label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="4" autocomplete="new-password">
    </div>
    <button class="btn primary" type="submit">ذخیره رمز جدید</button>
  </form>
  <p class="muted" style="margin-top:14px;">پس از تغییر رمز، باید دوباره با رمز جدید وارد شوید.</p>
</div>
{% endblock %}
